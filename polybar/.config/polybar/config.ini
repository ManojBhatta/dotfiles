[bar/example]
monitor = ${env:MONITOR:}
width = 100%
bottom = False
fixed-center = True
height = 24
background = #19191900
foreground = #fbf1cf
font-0 = "JetBrainsMono Nerd Font:size=11;2"
modules-left = i3 spacer_kiri window
modules-right =separator backlight separator wifi separator pulseaudio   separator  memory separator battery separator cpu separator date separator tray
tray-position = right
font-1 = "JetBrainsMono Nerd Font:size=11;2"
line-size = 8

[module/i3]
type = internal/i3
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = #e60053

label-focused = %index%
label-focused-foreground = #1d2021
label-focused-background = #458588
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = #555555
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = #282828
label-urgent-background = #cc241d
label-urgent-padding = 1

[module/tray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px

[module/window]
type = internal/xwindow
label = %title%
format = <label>
format-padding = 1
label-maxlen = 60


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <label-charging>
label-charging = %{T2}󰂄 %{T-}%percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

ramp-capacity-0 = %{T2}󰁺
ramp-capacity-1 = %{T2}󰁼
ramp-capacity-2 = %{T2}󰁾
ramp-capacity-3 = %{T2}󰂀
ramp-capacity-4 = %{T2}󰂂

format-full = <label-full>
format-full-padding = 0
label-full = %{T2} 󱟢 %{T-}%percentage%%%{T-}
label-full-padding = 0

[module/spacer]
type = custom/text
content = " | "


[module/cpu]
type = internal/cpu
interval = 0.5
warn-percentage = 95
format = <label> 
label = %{T2}%{T-} CPU %percentage%%
; label-foreground = #d65d0e

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95
format = <label> 
label = %{T2} %{T-}RAM %percentage_used%%
; label-foreground = #d79921

[module/wifi]
type = custom/script
interval = 5
exec = ~/.config/polybar/scripts/wifi_status.sh
click-left = gnome-terminal -e nmtui
; label-foreground = #076678

[module/volume]
type = internal/volume
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = %{T2}
ramp-volume-1 = %{T2}
ramp-volume-2 = %{T2}
ramp-volume-3 = %{T2}
format-muted = %{T2} muted
interval = 2
click-left =pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/pulseaudio]
type = internal/volume
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = %{T2}
ramp-volume-1 = %{T2}
ramp-volume-2 = %{T2}
format-muted = %{T2} muted
interval = 2
click-left =pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/separator]
type = custom/text
content = " | "

[module/spacer_kiri]
type = custom/text
content = "  "

[module/date]
type = internal/date
label-foreground = #ebdbb2
interval = 1.0
label = %date% %time%
date-alt = %b %d,
time = %H:%M
date = %A, %d %B %Y
# time-alt = %H:%M:%S

[module/backlight]
type = internal/backlight
; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
; Default: first usable card in /sys/class/backlight (new in version 3.7.0)
card = intel_backlight
poll-interval = 0
format =<ramp> <label>

; Available tokens:
;   %percentage% (default)
label = %percentage%%
; Only applies if <ramp> is used
ramp-0 = %{T2}󰃜
ramp-1 = %{T2}󰃝
ramp-2 = %{T2}󰃞
ramp-3 = %{T2}󰃟
ramp-4 = %{T2}󰃠

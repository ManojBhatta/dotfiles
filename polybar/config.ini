[bar/example]
monitor = ${env:MONITOR:}
width = 100%
bottom = True
fixed-center = True
height = 22
background = #504945
foreground = #fbf1c7
font-0 = FiraMono Nerd Font Mono:size=11
modules-left = i3 spacer_kiri window
modules-right = volume separator wifi separator  memory separator cpu separator battery separator date separator tray
tray-position = right
font-1 = "Firamono Nerd Font:size=11"
line-size = 8

[module/i3]
type = internal/i3
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = #e60053

label-focused = %index%
label-focused-foreground = #1d2021
label-focused-background = #458588
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = #555555
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = #282828
label-urgent-background = #cc241d
label-urgent-padding = 1

[module/tray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px

[module/window]
type = internal/xwindow
label = %title%
format = <label>
format-padding = 1
label-maxlen = 60


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <label-charging>
label-charging = %{T2} 󱐋%{T-}%percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = %{T2}
ramp-capacity-1 = %{T2}
ramp-capacity-2 = %{T2}
ramp-capacity-3 = %{T2}
ramp-capacity-4 = %{T2}

format-full = <label-full>
format-full-padding = 0
label-full = %{T2}  %{T-}%percentage%%%{T-}
label-full-padding = 0

[module/spacer]
type = custom/text
content = " | "


[module/cpu]
type = internal/cpu
interval = 0.5
warn-percentage = 95
format = <label> 
label = %{T2}%{T-} CPU %percentage%%

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95
format = <label> 
label = %{T2} %{T-}RAM %percentage_used%%

[module/wifi]
type = custom/script
interval = 5
exec = ~/.config/polybar/scripts/wifi_status.sh
click-left = gnome-terminal -e nmtui

[module/volume]
type = internal/volume
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = %{T2}
ramp-volume-1 = %{T2}
ramp-volume-2 = %{T2}
ramp-volume-3 = %{T2}
format-muted = %{T2} muted
label-muted-foreground = #888888
interval = 2
click-left =pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/separator]
type = custom/text
content = " | "

[module/spacer_kiri]
type = custom/text
content = "  "

[module/date]
type = internal/date
interval = 1.0
label = %date% %time%
date-alt = %b %d,
time = %H:%M
date = %A, %d %B %Y
time-alt = %H:%M:%S
